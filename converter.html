<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>String to Hex Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 100px;
      font-size: 16px;
    }
    #hexOutput {
      margin-top: 10px;
      padding: 10px;
      background-color: #f0f0f0;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 10px;
      margin-right: 10px;
      padding: 10px 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>String to Hex Converter</h2>

  <textarea id="inputText" placeholder="Enter your string here...">$0126NDLS:NEW DELHI:NEW DELHI:^</textarea>
  <br>
  <button onclick="convertToHex()">Convert</button>
  <button onclick="copyToClipboard()">Copy</button>

  <div id="hexOutput"></div>

  <script>
    function stringToHex(input) {
      let hexString = '';
      for (let i = 0; i < input.length; i++) {
        hexString += input.charCodeAt(i).toString(16);
      }
      return hexString;
    }

    function convertToHex() {
      const input = document.getElementById('inputText').value;
      const hex = stringToHex(input);
      document.getElementById('hexOutput').innerText = hex;
    }

    function copyToClipboard() {
      const hexText = document.getElementById('hexOutput').innerText;
      navigator.clipboard.writeText(hexText).then(() => {
        alert('Hex data copied to clipboard!');
      }).catch(err => {
        alert('Failed to copy: ' + err);
      });
    }
  </script>

</body>
</html>
