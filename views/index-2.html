<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indian Railways</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        font-family: Arial, sans-serif;
        background-color: #f8f8f8;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .form-container {
        width: 100%;
        height: 100%;
        border: 2px solid #000;
        background-color: #fff;
        display: flex;
        flex-direction: column;
      }

      .content {
        flex: 1;
      }

      .header {
        display: flex;
        align-items: center;
        padding: 10px;
        color: red;
      }

      .header img {
        width: 50px;
        height: 50px;
        margin-right: 15px;
      }

      .header h1 {
        font-size: 1.5rem;
        text-transform: uppercase;
      }

      .fare-header {
        background-color: #000;
        color: #fff;
        text-align: center;
        padding: 10px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 1rem;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
      }

      th {
        background-color: #f4f4f4;
        font-weight: bold;
      }

      td {
        background-color: #111;
        color: #fff;
      }

      .highlight {
        font-size: 2rem;
        font-weight: bold;
        color: red;
        text-align: center;
      }

      .footer {
        background-color: #000;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        flex-wrap: wrap;
      }

      .scan {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 10px;
      }

      .qr-code {
        width: 250px;
        height: auto;
        border: 1px solid #ddd;
      }

      @media (max-width: 768px) {
        .header h1 {
          font-size: 1.2rem;
        }

        .fare-header {
          flex-direction: column;
          text-align: center;
        }

        table {
          font-size: 0.9rem;
        }

        .footer {
          flex-direction: column;
          text-align: center;
          gap: 10px;
        }

        .qr-code {
          width: 120px;
        }
      }

      @media (max-width: 480px) {
        .header h1 {
          font-size: 1rem;
        }

        table {
          font-size: 0.85rem;
        }

        .qr-code {
          width: 100px;
        }

        th,
        td {
          padding: 6px;
        }
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <div class="content">
        <div class="header">
          <img
            src="./images/indian-railways-logo.png"
            alt="Indian Railways Logo"
          />
          <h1>Indian Railways</h1>
        </div>

        <div class="fare-header">
          <div>North Eastern Railway</div>
          <div>Fare Display System</div>
        </div>

        <table>
          <tr>
            <th>From <br />(कहाँ से)</th>
            <td id="source_station"></td>
            <th>To <br />(कहाँ तक)</th>
            <td id="destination_station"></td>
          </tr>
          <tr>
            <th>Date <br />(दिनांक)</th>
            <td id="display_date"></td>
            <!-- <td>25/01/2024</td> -->
            <th>Adult</th>
            <td id="display_adult"></td>
          </tr>
          <tr>
            <th>Child</th>
            <td id="display_child"></td>
            <th>Class</th>
            <td id="display_class"></td>
          </tr>
          <tr>
            <th>Type of Train <br />(ट्रेन का प्रकार)</th>
            <td id="display_train_type"></td>
            <th>Fare <br />(किराया)</th>
            <td class="highlight" id="display_fare"></td>
          </tr>
          <tr>
            <th>Transaction Type</th>
            <td id="display_transaction_type"></td>
            <th>Pay Mode</th>
            <td id="display_pay_mode"></td>
          </tr>
          <tr>
            <th>Operator Name</th>
            <td colspan="3" id="display_operator_name"></td>
          </tr>
        </table>
      </div>

      <div class="footer">
        <div><strong>Generated by:</strong> Fare Display System</div>
        <div class="scan">
          <img class="qr-code" id="display_qr_code" src="" alt="QR Code" />
          <p>Scan this QR to pay</p>
        </div>
      </div>
    </div>

    <script>
      window.electronAPI.onSerialData((event, data) => {
        console.log(data);

        // source_station,
        if (data.source_station) {
          const sourceEl = document.getElementById("source_station");
          sourceEl.textContent = `${data.source_station.eng_name} (${data.source_station.station_code})`;
        }

        // destination_station
        if (data.destination_station) {
          const sourceEl = document.getElementById("destination_station");
          sourceEl.textContent = `${data.destination_station.eng_name} (${data.destination_station.station_code})`;
        }

        // date and month
        if (data.date && data.month) {
          const displayDateEl = document.getElementById("display_date");
          displayDateEl.textContent = `${data.date.dateData}/${data.month.monthData}`;
        }

        // display_adult
        if (data.adult) {
          const adultEl = document.getElementById("display_adult");
          adultEl.textContent = `${data.adult.adultData}`;
        }

        // display_child
        if (data.child) {
          const childEl = document.getElementById("display_child");
          childEl.textContent = `${data.child.childData}`;
        }

        // display_class
        if (data.class) {
          const classEl = document.getElementById("display_class");
          classEl.textContent = `${data.class.Class}`;
        }

        // display_train_type
        if (data.type_of_trian) {
          const el = document.getElementById("display_train_type");
          el.textContent = `${data.type_of_trian.value} (${data.type_of_trian.description})`;
        }

        // display_fare
        if (data.fare) {
          const el = document.getElementById("display_fare");
          el.textContent = `${data.fare.fareData}`;
        }

        // display_transaction_type
        if (data.transaction_type) {
          const el = document.getElementById("display_transaction_type");
          el.textContent = `${data.transaction_type.transactionType}`;
        }

        // display_pay_mode
        if (data.payment_gateway) {
          const el = document.getElementById("display_pay_mode");
          el.textContent = `${data.payment_gateway.paymentGateway}`;
        }

        // display_operator_name
        if (data.operator_details) {
          const el = document.getElementById("display_operator_name");
          el.textContent = `${data.operator_details.Operator}`;
        }

        // display_qr_code
        if (data.qr_code) {
          const el = document.getElementById("display_qr_code");
          el.src = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(
            data.qr_code.QRCode
          )}&size=150x150`;
        }
      });

      window.electronAPI.onClearScreen((event, data) => {
        const elements = [
          "source_station",
          "destination_station",
          "display_date",
          "display_adult",
          "display_child",
          "display_class",
          "display_train_type",
          "display_fare",
          "display_transaction_type",
          "display_pay_mode",
          "display_operator_name",
        ];
        elements.forEach((id) => {
          const tag = document.getElementById(id);
          if (tag) {
            tag.textContent = "";
          }
        });
        const qrEl = document.getElementById("display_qr_code");
        if (qrEl) {
          qrEl.src = "";
        }
      });
    </script>
  </body>
</html>
